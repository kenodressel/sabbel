[project]
name = "sabbel"
version = "0.0.0-dev"
description = "Local voice dictation for macOS"
requires-python = ">=3.10"
dependencies = [
    "parakeet-mlx>=0.5.2",
    # Pinned deliberately, not transitively. MLX 0.32 made streams
    # thread-owned: a model loaded on one thread cannot be evaluated on
    # another. Nothing in this repo used to state which MLX Sabbel supports,
    # so a fresh resolve crossed that boundary on its own and shipped a
    # release that transcribed nothing. Widen only with a real-model test.
    "mlx>=0.32,<0.33",
    "sounddevice>=0.5.0",
    "numpy>=1.24",
    "pynput>=1.8.0",
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-AVFoundation",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
build = ["py2app>=0.28.8", "setuptools<81"]

[project.scripts]
sabbel = "sabbel.__main__:main"

[tool.setuptools.packages.find]
include = ["sabbel*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
