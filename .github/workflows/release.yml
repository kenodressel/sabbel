name: Release

on:
  push:
    tags:
      - "v*"
  # Build-only dry run: verifies the bundle without publishing anything.
  # The publish step below is gated on an actual tag.
  workflow_dispatch:

permissions:
  contents: write

env:
  # Opt actions/checkout@v4, astral-sh/setup-uv@v4, softprops/action-gh-release@v2
  # into Node 24 ahead of the Sept 2026 forced cutover. Drop once all pinned
  # actions ship a default-Node-24 release.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-14  # Apple Silicon M1
    steps:
      - uses: actions/checkout@v4

      - name: Install Python from python.org
        run: |
          curl -fsSL https://www.python.org/ftp/python/3.13.3/python-3.13.3-macos11.pkg -o /tmp/python.pkg
          sudo installer -pkg /tmp/python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.13/bin" >> $GITHUB_PATH

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          # --frozen, not pip: pip resolves fresh and happily picks up an MLX
          # the suite has never run against. That is how mlx 0.32 (per-thread
          # streams) reached a release build while uv.lock still said 0.31.
          FWPYTHON=/Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13
          uv sync --frozen --python "$FWPYTHON" --extra build --extra dev

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          sed -i '' "s/__version__ = \"dev\"/__version__ = \"$VERSION\"/" sabbel/__init__.py
          grep -q "__version__ = \"$VERSION\"" sabbel/__init__.py \
            || { echo "✗ Failed to set version in sabbel/__init__.py"; exit 1; }
          echo "✓ Version set to $VERSION (setup.py reads this at build time)"

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -v

      - name: Cache the Parakeet model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-${{ hashFiles('sabbel/transcriber.py') }}
          restore-keys: hf-

      - name: Run real-model tests
        # The mocked suite above cannot see MLX itself: thread-owned streams
        # (v0.4.x transcribed nothing) and the buffer cache that grew ~0.5 GB
        # per dictation (v0.5.0) both shipped past it.
        run: .venv/bin/python -m pytest -m model -v

      - name: Build Sabbel.app
        # The Makefile is the one build recipe; the bundle fixups used to be
        # copied here as well, and a fix to one copy could miss the other.
        run: make build-app BUILD_PYTHON=.venv/bin/python

      - name: Verify bundle is standalone
        run: |
          test -d dist/Sabbel.app/Contents/MacOS
          test -f dist/Sabbel.app/Contents/Info.plist
          test -f dist/Sabbel.app/Contents/Frameworks/mlx.metallib
          # Framework Python embeds Python.framework, non-framework embeds libpython
          if [ -f dist/Sabbel.app/Contents/Frameworks/libpython3.13.dylib ] || \
             [ -d dist/Sabbel.app/Contents/Frameworks/Python.framework ]; then
            echo "✓ Python embedded (standalone)"
          else
            echo "✗ Python NOT embedded (semi-standalone)"
            echo "Contents of Frameworks/:"
            ls -la dist/Sabbel.app/Contents/Frameworks/
            exit 1
          fi
          # Check no absolute paths leak
          LEAKS=$(find dist/Sabbel.app \( -name "*.dylib" -o -name "*.so" \) \
            -exec otool -L {} \; 2>/dev/null \
            | grep -E "^\t/(opt/homebrew|usr/local|Users)" || true)
          if [ -n "$LEAKS" ]; then
            echo "✗ Non-portable paths found:"
            echo "$LEAKS"
            exit 1
          fi
          echo "✓ No path leaks detected"
          echo "✓ Bundle verification passed"

      - name: Zip the app
        run: |
          cd dist
          ditto -ck --keepParent Sabbel.app Sabbel.zip

      - name: Create GitHub Release
        # Only on a real tag. A workflow_dispatch run stops after the bundle
        # verification above — every v* tag becomes the "latest" release that
        # install.sh serves, so there is no such thing as a throwaway tag here.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Sabbel.zip
          generate_release_notes: true
