name: Release

on:
  push:
    tags:
      - "v*"
  # Build-only dry run: builds and verifies the bundle (ad hoc signed) without
  # publishing anything. Signing and publishing are gated on a tag *push*.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Run native tests
        run: make native-test

      # The Parakeet v3 CoreML models (~0.5 GB) are cached so only the first run
      # (or a FluidAudio bump, which changes Package.resolved) downloads them.
      - name: Cache Parakeet models
        uses: actions/cache@v6
        with:
          path: ~/Library/Application Support/FluidAudio/Models
          key: parakeet-models-${{ hashFiles('native/Package.resolved') }}

      - name: Run native model tests
        run: make native-test-model
        timeout-minutes: 20

      - name: Import signing certificate
        # A tag push only. A dry run builds ad hoc, so a branch can never produce
        # something that looks like a release; the event check keeps a manual
        # dispatch run on a tag ref a dry run too.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          SABBEL_SIGN_P12: ${{ secrets.SABBEL_SIGN_P12 }}
          SABBEL_SIGN_P12_PASSWORD: ${{ secrets.SABBEL_SIGN_P12_PASSWORD }}
        run: |
          [ -n "$SABBEL_SIGN_P12" ] && [ -n "$SABBEL_SIGN_P12_PASSWORD" ] \
            || { echo "✗ SABBEL_SIGN_P12 / SABBEL_SIGN_P12_PASSWORD secrets are not set"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/sabbel-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          # Recorded first so the always-run cleanup deletes it even if a later command fails.
          echo "SABBEL_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "$SABBEL_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sabbel-sign.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/sabbel-sign.p12" -k "$KEYCHAIN" \
            -P "$SABBEL_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/sabbel-sign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Put the temporary keychain first in the search list (keep the others).
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "SABBEL_SIGN_IDENTITY=Sabbel Release" >> "$GITHUB_ENV"

      - name: Build Sabbel.app
        # A dry run builds "dev" (version 0.0.0), ad hoc signed.
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            make build-app VERSION="${GITHUB_REF_NAME#v}"
          else
            make build-app
          fi

      - name: Refuse ad-hoc signature
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          # Authority= lines appear only at -dvv; plain -dv never prints them.
          codesign -dvv dist/Sabbel.app 2>&1 | grep -q "Authority=Sabbel Release" \
            || { echo "✗ dist/Sabbel.app is not signed by Sabbel Release"; codesign -dvv dist/Sabbel.app 2>&1; exit 1; }
          echo "✓ Signed by Sabbel Release"

      - name: Verify bundle is standalone
        run: |
          test -x dist/Sabbel.app/Contents/MacOS/Sabbel
          test -f dist/Sabbel.app/Contents/Info.plist
          test -f dist/Sabbel.app/Contents/Resources/Sabbel.icns
          codesign --verify --deep --strict dist/Sabbel.app
          # Every dependency of the binary and of anything bundled must be a
          # system library or an @rpath/@loader_path/@executable_path one.
          LEAKS=$(find dist/Sabbel.app -type f \( -perm -u+x -o -name "*.dylib" -o -name "*.so" \) \
            -exec otool -L {} \; 2>/dev/null \
            | grep -E "^\s+/" | grep -vE "^\s+/(System|usr/lib)/" || true)
          if [ -n "$LEAKS" ]; then
            echo "✗ Non-portable paths found:"
            echo "$LEAKS"
            exit 1
          fi
          # Every @rpath dependency must resolve inside the bundle.
          MISSING=0
          for dep in $(otool -L dist/Sabbel.app/Contents/MacOS/Sabbel | awk '/@rpath\//{print $1}'); do
            name="${dep#@rpath/}"
            if ! find dist/Sabbel.app -path "*/$name" | grep -q .; then
              echo "✗ $dep not found in the bundle"; MISSING=1
            fi
          done
          [ "$MISSING" = 0 ] || exit 1
          echo "✓ Bundle verification passed"

      - name: Zip the app
        run: |
          cd dist
          ditto -ck --keepParent Sabbel.app Sabbel.zip

      - name: Create GitHub Release
        # Only on a tag push. A workflow_dispatch run stops after the zip, even
        # when dispatched on a tag ref. Every non-prerelease v* tag becomes the
        # "latest" release that install.sh and the in-app update check serve; a
        # tag with "-" is a prerelease.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Sabbel.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Delete signing keychain
        if: always()
        run: |
          if [ -n "${SABBEL_SIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$SABBEL_SIGN_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/sabbel-sign.p12"
