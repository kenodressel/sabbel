name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install Python from python.org
        run: |
          curl -fsSL https://www.python.org/ftp/python/3.13.3/python-3.13.3-macos11.pkg -o /tmp/python.pkg
          sudo installer -pkg /tmp/python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.13/bin" >> $GITHUB_PATH

      - name: Install uv
        # setup-uv publishes no major tags since v8 — pin the exact release.
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: |
          # --frozen, not pip: pip resolves fresh and happily picks up an MLX
          # the suite has never run against. That is how mlx 0.32 (per-thread
          # streams) reached a release build while uv.lock still said 0.31.
          FWPYTHON=/Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13
          uv sync --frozen --python "$FWPYTHON" --extra dev

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -v

      - name: Cache the Parakeet model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: hf-${{ hashFiles('sabbel/transcriber.py') }}
          restore-keys: hf-

      - name: Run real-model tests
        # The mocked suite above cannot see MLX itself: thread-owned streams
        # (v0.4.x transcribed nothing) and the buffer cache that grew ~0.5 GB
        # per dictation (v0.5.0) both shipped past it.
        run: .venv/bin/python -m pytest -m model -v
