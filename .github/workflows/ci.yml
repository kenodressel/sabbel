name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Run native tests
        run: make test

      # The Parakeet v3 CoreML models (~0.5 GB) are cached so only the first run
      # (or a FluidAudio bump, which changes Package.resolved) downloads them.
      # The first load still compiles the models for a minute or two.
      - name: Cache Parakeet models
        uses: actions/cache@v6
        with:
          path: ~/Library/Application Support/FluidAudio/Models
          key: parakeet-models-${{ hashFiles('native/Package.resolved') }}

      - name: Run native model tests
        run: make test-model
        timeout-minutes: 20

      - name: Build and verify the app bundle
        # Ad hoc signed; proves the bundle assembles and verifies on every PR.
        run: |
          make build-app
          codesign --verify --deep --strict dist/Sabbel.app
